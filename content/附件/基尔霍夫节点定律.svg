<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" role="img" aria-labelledby="kcl-title kcl-desc">
  <title id="kcl-title">基尔霍夫节点定律</title>
  <desc id="kcl-desc">透明背景的电流分流示意图。一条干路从左侧接入中心实心节点，分成向上和向下延伸后向右的两个支路。I1 的箭头沿干路指向节点；I2、I3 的箭头分别沿上、下支路离开节点。稳恒电流满足 I1 = I2 + I3。图中无开关或其他电路元件。</desc>

  <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path id="main-wire" d="M60 160 H280"/>
    <path id="upper-branch" d="M280 160 V70 H560"/>
    <path id="lower-branch" d="M280 160 V250 H560"/>

    <path id="i1-arrowhead" d="M173 154 L185 160 L173 166"/>
    <path id="i2-arrowhead" d="M433 64 L445 70 L433 76"/>
    <path id="i3-arrowhead" d="M433 244 L445 250 L433 256"/>
    <circle id="junction" cx="280" cy="160" r="3" fill="#000000" stroke="none"/>
  </g>

  <g fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">
    <text x="179" y="136">I1</text>
    <text x="439" y="46">I2</text>
    <text x="439" y="226">I3</text>
  </g>
</svg>
