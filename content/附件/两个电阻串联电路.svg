<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">两个电阻串联电路 / Two Resistors in Series</title>
  <desc id="desc">透明背景的串联电路图，包含标注为 R1、R2 的两个电阻、标注为 Switch 的断开开关和标注为 Battery 的电池组。元件沿用电子元件文件夹中的黑色细线、圆角端点与锯齿形电阻样式。</desc>

  <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting wires: a single series branch with no junctions. -->
    <path id="wires" d="M64 280 V100 H104 M248 100 H280 M424 100 H456 M600 100 H656 V280 H432 M288 280 H64"/>

    <!-- Same geometry as 电子元件/switch-open.svg. -->
    <g id="switch" transform="translate(96 52)">
      <path d="M8 48 H60 M100 48 H152 M60 48 L98 28"/>
      <circle cx="60" cy="48" r="3" fill="#000000" stroke="none"/>
      <circle cx="100" cy="48" r="3" fill="#000000" stroke="none"/>
    </g>

    <!-- Same geometry as 电子元件/resistor.svg. -->
    <g id="resistor-1" transform="translate(272 52)">
      <path d="M8 48 H52 L56 38 L64 58 L72 38 L80 58 L88 38 L96 58 L104 38 L108 48 H152"/>
    </g>
    <g id="resistor-2" transform="translate(448 52)">
      <path d="M8 48 H52 L56 38 L64 58 L72 38 L80 58 L88 38 L96 58 L104 38 L108 48 H152"/>
    </g>

    <!-- Same geometry as 电子元件/battery.svg. Long plates are positive. -->
    <g id="battery" transform="translate(280 232)">
      <path d="M8 48 H68 M68 28 V68 M76 38 V58 M84 28 V68 M92 38 V58 M92 48 H152"/>
    </g>
  </g>

  <g fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">
    <text x="176" y="61">Switch</text>
    <text x="352" y="61">R1</text>
    <text x="528" y="61">R2</text>
    <text x="360" y="340">Battery</text>
  </g>
</svg>
